services:
  - type: web
    name: pbl-evaluator-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./pbl_evaluator.db
      - key: PYTHON_VERSION
        value: "3.11"
